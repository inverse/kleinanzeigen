name: Publish

on:
  release:
    types: [published]

env:
  MISE_IDIOMATIC_VERSION_FILE_ENABLE_TOOLS: python

jobs:
  publish:
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/kleinanzeigen
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # hatch-vcs needs tag ancestry to derive the version
    - uses: jdx/mise-action@v5
    - name: Install pip dependencies
      run: uv sync
    - name: Package
      run: uv build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.2
