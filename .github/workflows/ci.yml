name: CI

on:
  push:
    branches: [master]
  pull_request: ~

env:
  FORCE_COLOR: 1

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v5
    - name: Install pip dependencies
      run: uv sync
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit/
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run pre-commit
      run: pre-commit run --all-files --show-diff-on-failure
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ['3.15', '3.14']
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v5
    - name: Project python version
      id: project-python-version
      run: |
        ver=$(grep -oP 'python\s*=\s*"\K[^"]+' mise.toml | cut -d. -f1-2)
        echo "python-version=$ver" >> $GITHUB_OUTPUT
    - name: Install python
      run: mise install python@${{ matrix.python-version }}
    - name: Install pip dependencies
      run: uv sync
    - name: Run tests
      run: uv run pytest --cov --junitxml=junit.xml -o junit_family=legacy --cov-branch --cov-report=xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: inverse/kleinanzeigen
