[project]
name = "kleinanzeigen"
version = "0.1.0"
description = "Async client for querying kleinanzeigen.de over plain HTTP (no browser)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.5.1",
    "mcp>=1.0,<2",
    "rich>=15.0.0",
    "humanize>=4.16.0",
    "curl-cffi>=0.17.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.0.0,<8",
    "pytest-socket>=0.8",
]

[project.scripts]
kleinanzeigen = "kleinanzeigen.cli:main"
kleinanzeigen-mcp = "kleinanzeigen.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kleinanzeigen"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
