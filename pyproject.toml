[project]
name = "kleinanzeigen"
dynamic = ["version"]
description = "Async client for querying kleinanzeigen.de over plain HTTP (no browser)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.5.1",
    "mcp>=1.0,<2",
    "rich>=15.0.0",
    "humanize>=4.16.0",
    "curl-cffi>=0.17.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.0.0,<8",
    "pytest-socket>=0.8",
]

[project.scripts]
kleinanzeigen = "kleinanzeigen.cli:main"
kleinanzeigen-mcp = "kleinanzeigen.mcp_server:main"

[build-system]
requires = ["hatchling", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/kleinanzeigen"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.mypy]
strict = true
